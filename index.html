<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>单摆物理模拟器 · Pendulum Simulator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #1a1a24;
      color: #e0e6ed;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    header {
      margin-bottom: 14px;
      text-align: center;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      color: #f0f4f8;
      letter-spacing: 0.02em;
    }

    .subtitle {
      display: inline-block;
      margin-top: 6px;
      font-size: 0.75rem;
      padding: 3px 10px;
      border-radius: 10px;
      background: rgba(0, 229, 255, 0.12);
      color: #00e5ff;
      border: 1px solid rgba(0, 229, 255, 0.3);
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    canvas {
      display: block;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      border-radius: 12px;
      background: radial-gradient(circle at center, #222232 0%, #15151e 100%);
    }

    .hint {
      font-size: 0.78rem;
      color: #7c8598;
      margin-top: 8px;
    }

    /* ============ 参数控制面板 ============ */
    .control-panel {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: center;
      gap: 22px;
      padding: 14px 26px;
      background: rgba(30, 30, 42, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
      max-width: 820px;
      width: 100%;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.82rem;
    }

    .control-label {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: #90caf9;
      font-weight: 500;
    }

    .val-display {
      color: #ffffff;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-weight: 600;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 150px;
      height: 6px;
      border-radius: 3px;
      background: #33334d;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #00e5ff;
      cursor: pointer;
      box-shadow: 0 0 8px #00e5ff;
      transition: transform 0.15s ease;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }

    input[type="range"]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border: none;
      border-radius: 50%;
      background: #00e5ff;
      cursor: pointer;
      box-shadow: 0 0 8px #00e5ff;
    }

    .btn-reset {
      background: linear-gradient(135deg, #00b8d4 0%, #0091ea 100%);
      color: #ffffff;
      border: none;
      padding: 9px 20px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 2px 10px rgba(0, 145, 234, 0.4);
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .btn-reset:hover {
      background: linear-gradient(135deg, #00e5ff 0%, #00b8d4 100%);
      box-shadow: 0 4px 16px rgba(0, 229, 255, 0.55);
      transform: translateY(-1px);
    }

    .btn-reset:active {
      transform: translateY(0) scale(0.98);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>单摆物理模拟器</h1>
      <span class="subtitle">MVP · 简谐振动 · Canvas 原生渲染</span>
    </header>

    <canvas id="canvas" width="800" height="500"></canvas>

    <!-- ============ 实时参数交互控制面板 ============ -->
    <div class="control-panel">
      <div class="control-group">
        <div class="control-label">
          <span>摆长 Length</span>
          <span id="lenVal" class="val-display">200 px</span>
        </div>
        <input type="range" id="lenSlider" min="100" max="350" value="200" step="1">
      </div>

      <div class="control-group">
        <div class="control-label">
          <span>重力 Gravity</span>
          <span id="gravVal" class="val-display">9.8</span>
        </div>
        <input type="range" id="gravSlider" min="1" max="25" value="9.8" step="0.1">
      </div>

      <div class="control-group">
        <div class="control-label">
          <span>空气阻尼 Damping</span>
          <span id="dampVal" class="val-display">0.0000</span>
        </div>
        <input type="range" id="dampSlider" min="0.000" max="0.010" value="0.000" step="0.0005">
      </div>

      <button id="resetBtn" class="btn-reset" type="button">重置摆动</button>
    </div>

    <div class="hint">拖动滑块即时改变物理形态 · 点击「重置摆动」回到 45° 初始状态</div>
  </div>

  <script>
    // ============================================================
    //  单摆物理模拟器 —— 纯原生 HTML5 Canvas 实现，零外部依赖
    // ============================================================

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // ---------- 物理参数 ----------
    const CONFIG = {
      length: 200,          // 摆长 L（像素）
      gravity: 9.8,         // 重力加速度 g（m/s²）
      damping: 0.0,         // 空气阻尼系数 k
      initialAngle: Math.PI / 4,  // 初始摆角 45°（弧度）
      pivotY: 70            // 悬点距顶部距离
    };

    // 悬点位置
    const origin = { x: canvas.width / 2, y: CONFIG.pivotY };

    // ---------- 物理状态量 ----------
    let angle = CONFIG.initialAngle;   // 摆角 θ（弧度）
    let angularVelocity = 0.0;         // 角速度 ω（rad/s）
    let angularAcceleration = 0.0;     // 角加速度 α（rad/s²）

    let lastTime = performance.now();

    // ============================================================
    //  交互控件绑定：滑块 → 物理参数实时联动
    // ============================================================
    const lenSlider = document.getElementById('lenSlider');
    const gravSlider = document.getElementById('gravSlider');
    const dampSlider = document.getElementById('dampSlider');

    const lenVal = document.getElementById('lenVal');
    const gravVal = document.getElementById('gravVal');
    const dampVal = document.getElementById('dampVal');

    // 摆长（100 ~ 350 px）
    lenSlider.addEventListener('input', (e) => {
      CONFIG.length = parseFloat(e.target.value);
      lenVal.textContent = CONFIG.length + ' px';
    });

    // 重力加速度（1.0 ~ 25.0）
    gravSlider.addEventListener('input', (e) => {
      CONFIG.gravity = parseFloat(e.target.value);
      gravVal.textContent = CONFIG.gravity.toFixed(1);
    });

    // 空气阻尼（0.0000 ~ 0.0100）
    dampSlider.addEventListener('input', (e) => {
      CONFIG.damping = parseFloat(e.target.value);
      dampVal.textContent = CONFIG.damping.toFixed(4);
    });

    // ============================================================
    //  重置摆动：精准回到 45° 初始状态
    // ============================================================
    function resetAnimation() {
      angle = CONFIG.initialAngle;   // 45°
      angularVelocity = 0.0;
      angularAcceleration = 0.0;
      lastTime = performance.now();  // 重置计时，避免累积大 dt
    }

    document.getElementById('resetBtn').addEventListener('click', resetAnimation);

    // ============================================================
    //  物理积分：α = -(g / L) * sin(θ) - k * ω
    // ============================================================
    function updatePhysics(dt) {
      // 像素摆长换算为米：100px ≈ 1m，使重力加速度量纲生效
      const lengthMeters = CONFIG.length / 100;

      // 角加速度：重力回复项 + 阻尼项
      angularAcceleration =
        -(CONFIG.gravity / lengthMeters) * Math.sin(angle) -
        CONFIG.damping * angularVelocity;

      // 半隐式欧拉积分：先更新角速度，再用新角速度更新角度（更稳定）
      angularVelocity += angularAcceleration * dt;
      angle += angularVelocity * dt;
    }

    // ============================================================
    //  渲染：发光摆球 + 摆线 + 悬点
    // ============================================================
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 摆球位置
      const bobX = origin.x + CONFIG.length * Math.sin(angle);
      const bobY = origin.y + CONFIG.length * Math.cos(angle);

      // ---------- 摆线 ----------
      ctx.beginPath();
      ctx.moveTo(origin.x, origin.y);
      ctx.lineTo(bobX, bobY);
      ctx.strokeStyle = 'rgba(180, 200, 230, 0.45)';
      ctx.lineWidth = 2;
      ctx.shadowBlur = 0;
      ctx.stroke();

      // ---------- 悬点 ----------
      ctx.beginPath();
      ctx.arc(origin.x, origin.y, 7, 0, Math.PI * 2);
      ctx.fillStyle = '#90caf9';
      ctx.shadowColor = '#42a5f5';
      ctx.shadowBlur = 10;
      ctx.fill();

      // ---------- 摆球外发光光晕 ----------
      const halo = ctx.createRadialGradient(bobX, bobY, 4, bobX, bobY, 46);
      halo.addColorStop(0, 'rgba(0, 229, 255, 0.42)');
      halo.addColorStop(0.45, 'rgba(0, 229, 255, 0.12)');
      halo.addColorStop(1, 'rgba(0, 229, 255, 0)');
      ctx.beginPath();
      ctx.arc(bobX, bobY, 46, 0, Math.PI * 2);
      ctx.fillStyle = halo;
      ctx.shadowBlur = 0;
      ctx.fill();

      // ---------- 摆球主体 ----------
      ctx.beginPath();
      ctx.arc(bobX, bobY, 18, 0, Math.PI * 2);
      ctx.fillStyle = '#00e5ff';
      ctx.shadowColor = '#00e5ff';
      ctx.shadowBlur = 18;
      ctx.fill();

      // ---------- 高光点 ----------
      ctx.beginPath();
      ctx.arc(bobX - 5, bobY - 5, 5, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
      ctx.shadowBlur = 0;
      ctx.fill();
    }

    // ============================================================
    //  动画主循环：requestAnimationFrame 驱动
    // ============================================================
    function animate(currentTime) {
      // 时间步长（秒），上限 50ms 防止切后台回来时数值爆炸
      const dt = Math.min((currentTime - lastTime) / 1000, 0.05);
      lastTime = currentTime;

      updatePhysics(dt);
      draw();

      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
